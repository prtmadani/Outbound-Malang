<!-- gallery.html -->
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Galeri Outbound Malang: Dokumentasi foto kegiatan outbound, rafting, paintball, team building, gathering, camping, dan adventure di Malang dan Batu.">
    <meta name="keywords" content="galeri outbound malang, foto outbound, foto rafting malang, foto paintball">
    <link rel="canonical" href="https://outboundmalang.co.id/gallery.html">
    <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
    <meta property="og:title" content="Galeri Outbound Malang - Foto Kegiatan Outbound & Adventure">
    <meta property="og:description"
        content="Lihat keseruan kegiatan outbound, rafting, paintball, dan team building di Malang dan Batu.">
    <meta property="og:image" content="https://outboundmalang.co.id/images/gallery/gallery-og.jpg">
    <meta property="og:url" content="https://outboundmalang.co.id/gallery.html">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animation.css">
    <title>Galeri Outbound Malang - Foto Kegiatan Outbound, Rafting, Paintball</title>
</head>

<body>
    <!-- Preloader & Navbar (nav-link--active di Gallery) -->
    <main>
        <section class="page-header text-white"
            style="background: linear-gradient(135deg, #040dbf, #0460d9); padding: 120px 0 60px;">
            <div class="container text-center">
                <h1 class="display-4 fw-bold">Galeri Kegiatan</h1>
            </div>
        </section>
        <section class="section-padding">
            <div class="container">
                <!-- Filter buttons -->
                <div class="text-center mb-5 reveal-fade-up">
                    <button class="btn btn-outline-primary m-1 filter-btn active" data-filter="all">Semua</button>
                    <button class="btn btn-outline-primary m-1 filter-btn" data-filter="outbound">Outbound</button>
                    <button class="btn btn-outline-primary m-1 filter-btn" data-filter="rafting">Rafting</button>
                    <button class="btn btn-outline-primary m-1 filter-btn" data-filter="paintball">Paintball</button>
                    <button class="btn btn-outline-primary m-1 filter-btn" data-filter="camping">Camping</button>
                    <button class="btn btn-outline-primary m-1 filter-btn" data-filter="gathering">Gathering</button>
                </div>
                <!-- Masonry grid with Bootstrap cols and custom JS filter -->
                <div class="row g-3 masonry-grid">
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="outbound">
                        <a href="images/gallery/outbound-1.jpg" data-bs-toggle="lightbox" class="gallery-link">
                            <img src="images/gallery/outbound-1.jpg" class="w-100 rounded-3 shadow-sm"
                                alt="Outbound Team Building 1" loading="lazy">
                            <div class="gallery-hover"><i class="bi bi-zoom-in"></i></div>
                        </a>
                    </div>
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="rafting">
                        <a href="images/gallery/rafting-1.jpg" data-bs-toggle="lightbox"><img
                                src="images/gallery/rafting-1.jpg" class="w-100 rounded-3" alt="Rafting 1"></a>
                    </div>
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="paintball">
                        <a href="images/gallery/paintball-1.jpg" data-bs-toggle="lightbox"><img
                                src="images/gallery/paintball-1.jpg" class="w-100 rounded-3" alt="Paintball 1"></a>
                    </div>
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="outbound">
                        <a href="images/gallery/outbound-2.jpg" data-bs-toggle="lightbox"><img
                                src="images/gallery/outbound-2.jpg" class="w-100 rounded-3" alt="Outbound 2"></a>
                    </div>
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="camping">
                        <a href="images/gallery/camping-1.jpg" data-bs-toggle="lightbox"><img
                                src="images/gallery/camping-1.jpg" class="w-100 rounded-3" alt="Camping"></a>
                    </div>
                    <div class="col-lg-4 col-md-6 gallery-item" data-category="gathering">
                        <a href="images/gallery/gathering-1.jpg" data-bs-toggle="lightbox"><img
                                src="images/gallery/gathering-1.jpg" class="w-100 rounded-3" alt="Gathering"></a>
                    </div>
                    <!-- Tambahkan lebih banyak item sesuai kebutuhan -->
                </div>
            </div>
        </section>
    </main>
    <!-- Lightbox CSS & JS (gunakan Bootstrap modal atau library sederhana) -->
    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0"><button type="button"
                    class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                    data-bs-dismiss="modal"></button><img src="" class="w-100" id="lightboxImage"></div>
        </div>
    </div>
    <!-- Footer & Scripts -->
    <script>
        // Gallery filter
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const filter = this.dataset.filter;
                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
                });
            });
        });
        // Lightbox
        document.querySelectorAll('.gallery-link').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const imgSrc = this.getAttribute('href');
                document.getElementById('lightboxImage').src = imgSrc;
                new bootstrap.Modal(document.getElementById('lightboxModal')).show();
            });
        });
    </script>
</body>

</html>
